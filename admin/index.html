<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛡️ Admin - Duyệt Rút Tiền | Đào Vàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #FFD700;
      --gold-dark: #B8860B;
      --orange: #FF6D00;
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --bg-hover: #1a1a28;
      --border: rgba(255,255,255,0.08);
      --text: #E8E8F0;
      --text-dim: #888899;
      --green: #00C853;
      --red: #FF1744;
      --yellow: #FFC107;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* LOGIN */
    #page-login {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a0a0f, #12050a);
    }
    .login-box {
      background: var(--bg-card);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: var(--radius);
      padding: 40px 36px;
      width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .icon { font-size: 48px; }
    .login-logo h1 { font-size: 22px; font-weight: 900; color: var(--gold); margin-top: 8px; }
    .login-logo p { color: var(--text-dim); font-size: 13px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
    .field input {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'Outfit', sans-serif; font-size: 15px;
      outline: none; transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--gold); }
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #FFD700, #FF6D00);
      border: none; border-radius: 10px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700;
      color: #0a0a0f; transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(255,109,0,0.3);
    }
    .btn-login:hover { box-shadow: 0 6px 25px rgba(255,109,0,0.5); }
    .login-error {
      background: rgba(255,23,68,0.1); border: 1px solid rgba(255,23,68,0.3);
      color: #FF6B6B; border-radius: 8px; padding: 10px 14px;
      font-size: 13px; text-align: center; margin-bottom: 12px;
    }
    .hidden { display: none !important; }

    /* MAIN LAYOUT */
    #page-admin { display: none; min-height: 100vh; }
    #page-admin.active { display: block; }

    .topbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; }
    .topbar-brand .icon { font-size: 24px; }
    .topbar-brand h1 { font-size: 18px; font-weight: 700; color: var(--gold); }
    .topbar-brand span { font-size: 12px; color: var(--text-dim); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .btn-refresh {
      background: rgba(255,255,255,0.07); border: 1px solid var(--border);
      color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 13px; transition: background 0.2s;
    }
    .btn-refresh:hover { background: rgba(255,255,255,0.12); }
    .btn-logout-admin {
      background: rgba(255,23,68,0.1); border: 1px solid rgba(255,23,68,0.3);
      color: #FF6B6B; padding: 7px 14px; border-radius: 8px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 13px; transition: background 0.2s;
    }
    .btn-logout-admin:hover { background: rgba(255,23,68,0.2); }

    .main-content { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
    }
    .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 900; }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    .stat-value.gold { color: var(--gold); }
    .stat-value.blue { color: #2979FF; }

    /* FILTER TABS */
    .filter-bar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-tabs { display: flex; gap: 4px; }
    .filter-tab {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text-dim); padding: 7px 16px; border-radius: 8px;
      cursor: pointer; font-family: 'Outfit', sans-serif; font-size: 13px;
      font-weight: 600; transition: all 0.15s;
    }
    .filter-tab.active { background: rgba(255,215,0,0.1); border-color: rgba(255,215,0,0.4); color: var(--gold); }
    .filter-tab:hover:not(.active) { background: rgba(255,255,255,0.08); }

    /* TABLE */
    .table-wrapper {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: rgba(255,255,255,0.03);
      padding: 12px 16px; text-align: left;
      font-size: 12px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-hover); }
    tbody td { padding: 14px 16px; font-size: 14px; vertical-align: middle; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge-pending { background: rgba(255,193,7,0.15); color: var(--yellow); }
    .badge-approved { background: rgba(0,200,83,0.15); color: var(--green); }
    .badge-rejected { background: rgba(255,23,68,0.15); color: var(--red); }

    .amount-cell { font-size: 16px; font-weight: 700; color: #FF6B6B; }

    /* Action buttons */
    .action-cell { display: flex; align-items: flex-start; flex-direction: column; gap: 8px; }
    .action-approved-text { color: var(--green); font-size: 13px; font-weight: 600; }
    .action-rejected-text { color: var(--red); font-size: 13px; font-weight: 600; }
    .action-rejected-reason { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

    .btn-approve {
      background: rgba(0,200,83,0.15); border: 1px solid rgba(0,200,83,0.4);
      color: var(--green); padding: 6px 14px; border-radius: 8px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-approve:hover { background: rgba(0,200,83,0.25); }

    .btn-reject {
      background: rgba(255,23,68,0.1); border: 1px solid rgba(255,23,68,0.3);
      color: var(--red); padding: 6px 14px; border-radius: 8px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-reject:hover { background: rgba(255,23,68,0.2); }

    .btn-actions { display: flex; gap: 6px; }

    /* Reject Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid rgba(255,23,68,0.3);
      border-radius: var(--radius); width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-header {
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 16px; font-weight: 700; color: var(--red); }
    .modal-close-btn {
      background: rgba(255,255,255,0.07); border: 1px solid var(--border);
      color: var(--text); width: 28px; height: 28px; border-radius: 6px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .modal-body-admin { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-info { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 12px; font-size: 13px; color: var(--text-dim); }
    .modal-info strong { color: var(--text); }
    .reason-textarea {
      width: 100%; min-height: 90px; resize: vertical;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'Outfit', sans-serif; font-size: 14px;
      padding: 12px; outline: none; transition: border-color 0.2s;
    }
    .reason-textarea:focus { border-color: var(--red); }
    .modal-actions { display: flex; gap: 10px; }
    .btn-cancel-modal {
      flex: 1; padding: 11px;
      background: rgba(255,255,255,0.07); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600;
    }
    .btn-confirm-reject {
      flex: 2; padding: 11px;
      background: rgba(255,23,68,0.15); border: 1px solid rgba(255,23,68,0.4);
      color: var(--red); border-radius: 10px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700;
      transition: background 0.15s;
    }
    .btn-confirm-reject:hover { background: rgba(255,23,68,0.25); }

    /* Toast */
    .admin-toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      background: var(--bg-card); border-radius: 10px;
      padding: 12px 18px; font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      animation: slideInRight 0.3s ease-out;
      max-width: 320px;
    }
    @keyframes slideInRight { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }
    .admin-toast.success { border-left: 4px solid var(--green); color: var(--green); }
    .admin-toast.error { border-left: 4px solid var(--red); color: var(--red); }
    .admin-toast.info { border-left: 4px solid var(--gold); color: var(--gold); }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    @media (max-width: 768px) {
      .main-content { padding: 16px; }
      .topbar { padding: 12px 16px; }
      table { font-size: 13px; }
      tbody td { padding: 10px 12px; }
      thead th { padding: 10px 12px; }
      .btn-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="page-login">
    <div class="login-box">
      <div class="login-logo">
        <div class="icon">🛡️</div>
        <h1>Admin Panel</h1>
        <p>Game Đào Vàng - Quản lý rút tiền</p>
      </div>
      <div id="login-err" class="login-error hidden"></div>
      <div class="field">
        <label>Tên đăng nhập</label>
        <input type="text" id="admin-username" placeholder="Nhập username" />
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="admin-password" placeholder="Nhập mật khẩu" />
      </div>
      <button class="btn-login" onclick="adminLogin()">🔐 Đăng Nhập Admin</button>
    </div>
  </div>

  <!-- ADMIN PAGE -->
  <div id="page-admin">
    <div class="topbar">
      <div class="topbar-brand">
        <span class="icon">⛏️</span>
        <div>
          <h1>Admin Panel</h1>
          <span>Quản lý yêu cầu rút tiền</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn-refresh" onclick="loadAll()">🔄 Làm mới</button>
        <button class="btn-logout-admin" onclick="adminLogout()">🚪 Đăng xuất</button>
      </div>
    </div>

    <div class="main-content">
      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Đang chờ</div>
          <div class="stat-value yellow" id="stat-pending">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Đã duyệt</div>
          <div class="stat-value green" id="stat-approved">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Từ chối</div>
          <div class="stat-value red" id="stat-rejected">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Tổng người dùng</div>
          <div class="stat-value blue" id="stat-users">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Tổng đã duyệt</div>
          <div class="stat-value gold" id="stat-total">-</div>
        </div>
      </div>

      <!-- Filter -->
      <div class="filter-bar">
        <div class="filter-tabs">
          <button class="filter-tab active" data-tab="all" onclick="switchTab('all', this)">Tất cả</button>
          <button class="filter-tab" data-tab="pending" onclick="switchTab('pending', this)">⏳ Đang chờ</button>
          <button class="filter-tab" data-tab="approved" onclick="switchTab('approved', this)">✅ Đã duyệt</button>
          <button class="filter-tab" data-tab="rejected" onclick="switchTab('rejected', this)">❌ Từ chối</button>
        </div>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Người dùng</th>
              <th>Số tài khoản</th>
              <th>Số tiền</th>
              <th>Thời gian</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="withdrawals-tbody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-dim)">⏳ Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Reject Modal -->
  <div id="reject-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>❌ Từ Chối Rút Tiền</h3>
        <button class="modal-close-btn" onclick="closeRejectModal()">✕</button>
      </div>
      <div class="modal-body-admin">
        <div class="modal-info" id="reject-info"></div>
        <div>
          <label style="font-size:13px;color:var(--text-dim);font-weight:600;display:block;margin-bottom:6px">Lý do từ chối *</label>
          <textarea class="reason-textarea" id="reject-reason" placeholder="Nhập lý do từ chối để gửi cho người dùng..."></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel-modal" onclick="closeRejectModal()">Hủy</button>
          <button class="btn-confirm-reject" onclick="confirmReject()">❌ Xác nhận từ chối</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_API = '/api/admin';
    let adminToken = localStorage.getItem('admin_token');
    let currentTab = 'all';
    let rejectTargetId = null;
    let allWithdrawals = [];

    // Init
    if (adminToken) {
      showAdminPage();
      loadAll();
    }

    async function adminLogin() {
      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value;
      const errEl = document.getElementById('login-err');
      errEl.classList.add('hidden');

      try {
        const res = await fetch(`${ADMIN_API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        adminToken = data.token;
        localStorage.setItem('admin_token', adminToken);
        showAdminPage();
        loadAll();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    }

    function adminLogout() {
      adminToken = null;
      localStorage.removeItem('admin_token');
      document.getElementById('page-login').style.display = 'flex';
      document.getElementById('page-admin').classList.remove('active');
    }

    function showAdminPage() {
      document.getElementById('page-login').style.display = 'none';
      document.getElementById('page-admin').classList.add('active');
    }

    async function apiAdmin(method, path, body) {
      const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` };
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(`${ADMIN_API}${path}`, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Lỗi!');
      return data;
    }

    async function loadAll() {
      loadStats();
      loadWithdrawals();
    }

    async function loadStats() {
      try {
        const data = await apiAdmin('GET', '/stats');
        document.getElementById('stat-pending').textContent = data.pending;
        document.getElementById('stat-approved').textContent = data.approved;
        document.getElementById('stat-rejected').textContent = data.rejected;
        document.getElementById('stat-users').textContent = data.totalUsers;
        document.getElementById('stat-total').textContent = formatMoney(data.approvedTotal);
      } catch (e) {}
    }

    async function loadWithdrawals() {
      const tbody = document.getElementById('withdrawals-tbody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-dim)">⏳ Đang tải...</td></tr>';
      try {
        const url = currentTab === 'all' ? '/withdrawals' : `/withdrawals?status=${currentTab}`;
        allWithdrawals = await apiAdmin('GET', url);
        renderTable(allWithdrawals);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:#FF6B6B">❌ ${err.message}</td></tr>`;
      }
    }

    function renderTable(items) {
      const tbody = document.getElementById('withdrawals-tbody');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📭</div><p>Chưa có yêu cầu nào</p></div></td></tr>';
        return;
      }

      tbody.innerHTML = items.map((item, i) => {
        const date = new Date(item.createdAt);
        const timeStr = `${pad(date.getHours())}:${pad(date.getMinutes())} ${pad(date.getDate())}/${pad(date.getMonth()+1)}/${date.getFullYear()}`;

        let badgeHtml = '';
        if (item.status === 'pending') badgeHtml = '<span class="badge badge-pending">⏳ Đang chờ</span>';
        else if (item.status === 'approved') badgeHtml = '<span class="badge badge-approved">✅ Thành công</span>';
        else badgeHtml = '<span class="badge badge-rejected">❌ Từ chối</span>';

        let actionHtml = '';
        if (item.status === 'pending') {
          actionHtml = `
            <div class="btn-actions">
              <button class="btn-approve" onclick="approveWithdrawal('${item.id}')">✅ Duyệt</button>
              <button class="btn-reject" onclick="openRejectModal('${item.id}', '${item.userEmail}', ${item.amount})">❌ Từ chối</button>
            </div>`;
        } else if (item.status === 'approved') {
          actionHtml = '<div class="action-approved-text">✅ Đã phê duyệt</div>';
        } else {
          actionHtml = `<div><div class="action-rejected-text">❌ Đã từ chối</div>${item.rejectReason ? `<div class="action-rejected-reason">Lý do: ${item.rejectReason}</div>` : ''}</div>`;
        }

        const maskBank = item.bankAccount ? item.bankAccount.slice(0,3) + '***' + item.bankAccount.slice(-3) : '';

        return `
          <tr>
            <td style="color:var(--text-dim)">${i + 1}</td>
            <td>
              <div style="font-weight:600">${item.userEmail}</div>
              <div style="color:var(--text-dim);font-size:12px">📱 ${item.userPhone}</div>
            </td>
            <td style="font-family:monospace;letter-spacing:1px">${maskBank}</td>
            <td class="amount-cell">-${formatMoney(item.amount)}</td>
            <td style="color:var(--text-dim);font-size:13px">${timeStr}</td>
            <td>${badgeHtml}</td>
            <td>${actionHtml}</td>
          </tr>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      loadWithdrawals();
    }

    async function approveWithdrawal(id) {
      if (!confirm('Xác nhận phê duyệt yêu cầu rút tiền này?')) return;
      try {
        await apiAdmin('POST', `/withdrawals/${id}/approve`);
        showAdminToast('✅ Đã phê duyệt thành công!', 'success');
        loadAll();
      } catch (err) {
        showAdminToast('❌ ' + err.message, 'error');
      }
    }

    function openRejectModal(id, email, amount) {
      rejectTargetId = id;
      document.getElementById('reject-reason').value = '';
      document.getElementById('reject-info').innerHTML = `
        <strong>Người dùng:</strong> ${email}<br>
        <strong>Số tiền:</strong> ${formatMoney(amount)}
      `;
      document.getElementById('reject-modal').classList.remove('hidden');
    }

    function closeRejectModal() {
      rejectTargetId = null;
      document.getElementById('reject-modal').classList.add('hidden');
    }

    async function confirmReject() {
      const reason = document.getElementById('reject-reason').value.trim();
      if (!reason) { alert('Vui lòng nhập lý do từ chối!'); return; }
      try {
        await apiAdmin('POST', `/withdrawals/${rejectTargetId}/reject`, { rejectReason: reason });
        closeRejectModal();
        showAdminToast('Đã từ chối và hoàn tiền cho người dùng!', 'info');
        loadAll();
      } catch (err) {
        showAdminToast('❌ ' + err.message, 'error');
      }
    }

    function formatMoney(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + 'đ';
    }
    function pad(n) { return String(n).padStart(2, '0'); }

    let toastTimer;
    function showAdminToast(msg, type = 'info') {
      const existing = document.querySelector('.admin-toast');
      if (existing) existing.remove();
      const t = document.createElement('div');
      t.className = `admin-toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.remove(), 3500);
    }

    document.getElementById('admin-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') adminLogin();
    });
    document.getElementById('admin-username').addEventListener('keydown', e => {
      if (e.key === 'Enter') adminLogin();
    });

    // Close reject modal on overlay click
    document.getElementById('reject-modal').addEventListener('click', function(e) {
      if (e.target === this) closeRejectModal();
    });
  </script>
</body>
</html>
